name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  modules:
    name: Plan all workspace modules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      macos-matrix: ${{ steps.plan.outputs.macos-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
      - name: Validate workspace coverage and emit platform matrices
        id: plan
        run: |
          $matrix = & ./scripts/ci/modules.ps1
          $macos = & ./scripts/ci/modules.ps1 -Platform macos
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "macos-matrix=$macos" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  clippy-modules:
    name: clippy (${{ matrix.module }})
    needs: modules
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: clippy-${{ matrix.module }}
      - name: Lint every target in this package
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: cargo clippy -p $env:CI_PACKAGE --all-targets --locked -- -D warnings

  test-modules:
    name: test (${{ matrix.module }})
    needs: modules
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: test-${{ matrix.module }}
      - name: Run package unit, integration and documentation tests
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: cargo test -p $env:CI_PACKAGE --locked
      - name: Verify literal env loading and subprocess argument forwarding
        if: matrix.module == 'cli'
        run: ./scripts/tests/test-with-env.ps1

  platform-unix:
    name: CLI / eval (Linux)
    needs: modules
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Keep native build artifacts separate across Ubuntu image generations.
          key: cli-eval-ubuntu-26.04
      - name: Lint platform-specific atomic publication
        run: cargo clippy -p chat-tldr -p chat-tldr-eval --all-targets --locked -- -D warnings
      - name: Test publication races and symbolic aliases on a POSIX filesystem
        run: cargo test -p chat-tldr -p chat-tldr-eval --locked
      - name: Verify the offline acceptance script using synthetic QCE input
        run: ./scripts/verify-qce.ps1 -InputFile ./fixtures/qce/template-docker-export.json
      - name: Verify Ours versus B0 scoring and Jev calibration with local model doubles
        run: python scripts/release/evaluate_synthetic.py --cli target/debug/chat-tldr --eval target/debug/chat-tldr-eval --out tmp/ci-synthetic-evaluation
      - name: Verify literal env loading and subprocess argument forwarding
        run: ./scripts/tests/test-with-env.ps1

  gui-smoke:
    name: GUI smoke (Linux)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gui-native-smoke-ubuntu-26.04
      - name: Install virtual display and software OpenGL
        run: |
          sudo apt-get update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libwayland-dev libxkbcommon-dev
      - name: Test smoke failure detection
        run: python -m unittest discover -s scripts/tests -p test_gui_smoke.py
      - name: Build the real GUI and its adjacent CLI
        run: cargo build --locked -p chat-tldr-gui -p chat-tldr
      - name: Render all views and exercise the actual CLI bridge
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          $version = (cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json).packages | Where-Object name -eq 'chat-tldr-gui' | Select-Object -ExpandProperty version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xvfb-run -a -s '-screen 0 1600x1200x24' python scripts/release/gui_smoke.py --gui target/debug/chat-tldr-gui --cli target/debug/chat-tldr --version $version --out tmp/gui-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gui-native-smoke
          path: tmp/gui-smoke/
          if-no-files-found: warn
          retention-days: 7

  platform-macos:
    name: ${{ matrix.module }} (macOS)
    needs: modules
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.macos-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: native-macos-${{ matrix.module }}
      - name: Lint native application targets
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: cargo clippy -p $env:CI_PACKAGE --all-targets --locked -- -D warnings
      - name: Test native filesystem publication and subprocess behavior
        env:
          CI_PACKAGE: ${{ matrix.package }}
        run: cargo test -p $env:CI_PACKAGE --locked

  # Required check names stay stable as individual module jobs evolve.
  # A failed/cancelled/skipped plan or matrix can never satisfy these checks.
  clippy:
    name: clippy
    needs: [modules, clippy-modules, platform-unix, platform-macos]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Reject a cancelled workflow
        if: cancelled()
        run: exit 1
      - name: Require all clippy modules to succeed
        if: always()
        env:
          CI_PLAN_RESULT: ${{ needs.modules.result }}
          CI_MODULE_RESULT: ${{ needs.clippy-modules.result }}
          CI_UNIX_RESULT: ${{ needs.platform-unix.result }}
          CI_MACOS_RESULT: ${{ needs.platform-macos.result }}
        run: |
          if ($env:CI_PLAN_RESULT -ne 'success' -or $env:CI_MODULE_RESULT -ne 'success' -or $env:CI_UNIX_RESULT -ne 'success' -or $env:CI_MACOS_RESULT -ne 'success') {
            Write-Output "Clippy incomplete: plan=$env:CI_PLAN_RESULT modules=$env:CI_MODULE_RESULT unix=$env:CI_UNIX_RESULT macos=$env:CI_MACOS_RESULT"
            exit 1
          }

  test:
    name: test
    needs: [modules, test-modules, platform-unix, platform-macos, gui-smoke]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Reject a cancelled workflow
        if: cancelled()
        run: exit 1
      - name: Require all test modules to succeed
        if: always()
        env:
          CI_PLAN_RESULT: ${{ needs.modules.result }}
          CI_MODULE_RESULT: ${{ needs.test-modules.result }}
          CI_UNIX_RESULT: ${{ needs.platform-unix.result }}
          CI_MACOS_RESULT: ${{ needs.platform-macos.result }}
          CI_GUI_RESULT: ${{ needs.gui-smoke.result }}
        run: |
          if ($env:CI_PLAN_RESULT -ne 'success' -or $env:CI_MODULE_RESULT -ne 'success' -or $env:CI_UNIX_RESULT -ne 'success' -or $env:CI_MACOS_RESULT -ne 'success' -or $env:CI_GUI_RESULT -ne 'success') {
            Write-Output "Tests incomplete: plan=$env:CI_PLAN_RESULT modules=$env:CI_MODULE_RESULT unix=$env:CI_UNIX_RESULT macos=$env:CI_MACOS_RESULT gui=$env:CI_GUI_RESULT"
            exit 1
          }
