name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Tag publication is never cancelled by a newer push. Branch simulations can be.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  plan:
    name: Validate release identity
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      image: ${{ steps.plan.outputs.image }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        env:
          RELEASE_PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./scripts/release/plan.ps1 -Publish:($env:RELEASE_PUBLISH -eq 'true') -Tag $env:RELEASE_TAG -Commit $env:RELEASE_COMMIT -Repository $env:RELEASE_REPOSITORY

  windows:
    name: Package Windows CLI and GUI
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable action
        with:
          toolchain: '1.98.1'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-windows-x86_64
      - run: cargo build --locked --release -p chat-tldr -p chat-tldr-gui -p chat-tldr-qce-manager
      - name: Test optimized GUI protocol, errors, priority examples and pointer interactions
        run: cargo test --locked --release -p chat-tldr-gui -p chat-tldr-qce-manager
      - name: Exercise and package the actual executable
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python scripts/release/smoke.py --binary target/release/chat-tldr.exe --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/package.py --binary target/release/chat-tldr.exe --target windows-x86_64 --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/package.py --binary target/release/chat-tldr.exe --gui-binary target/release/chat-tldr-gui.exe --manager-binary target/release/chat-tldr-qce-manager.exe --target windows-x86_64 --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/gui_smoke.py --archive "dist/chat-tldr-gui-$env:RELEASE_VERSION-windows-x86_64.zip" --version $env:RELEASE_VERSION --package-only --out tmp/gui-package-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gui-release-test
          path: tmp/gui-package-smoke/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (Node 24)
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Package Linux CLI and Docker
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1 (Node 24)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0 (Node 24)
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: chat-tldr-ci:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          cache-from: type=gha,scope=cli-linux-amd64
          cache-to: type=gha,mode=max,scope=cli-linux-amd64
          provenance: false
      - name: Exercise final scratch image and extract the identical static CLI
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $image = "chat-tldr-ci:$env:RELEASE_COMMIT"
          python scripts/release/smoke.py --image $image --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path dist, tmp -Force | Out-Null
          $container = docker create $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          try {
            docker cp "${container}:/chat-tldr" tmp/chat-tldr
            if ($LASTEXITCODE -ne 0) { throw 'Cannot extract the tested binary.' }
          } finally { docker rm $container | Out-Null }
          chmod +x tmp/chat-tldr
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/smoke.py --binary tmp/chat-tldr --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/release/package.py --binary tmp/chat-tldr --target linux-x86_64-musl --version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          docker save --output dist/docker-image.tar $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/docker-image.tar -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  docker-image.tar" | Set-Content dist/docker-image.tar.sha256 -Encoding utf8
          docker image inspect $image --format 'Image size: {{.Size}} bytes; user: {{.Config.User}}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-docker
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Release quality
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish tested artifacts
    needs: [plan, windows, docker, quality]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1 (Node 24)
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0 (Node 24)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified CLI archives and the already tested image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_IMAGE: ${{ needs.plan.outputs.image }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: ./scripts/release/publish.ps1 -Version $env:RELEASE_VERSION -Commit $env:RELEASE_COMMIT -Image $env:RELEASE_IMAGE
