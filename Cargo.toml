[workspace]
members = ["crates/core", "crates/qce", "crates/engine", "apps/cli", "apps/gui", "eval"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Develata/chat-tldr"
publish = false

[workspace.dependencies]
chat-tldr-core = { path = "crates/core" }
chat-tldr-qce = { path = "crates/qce" }
chat-tldr-engine = { path = "crates/engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
thiserror = "2.0.20"
eframe = { version = "0.36.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
lto = "thin"
strip = "symbols"
